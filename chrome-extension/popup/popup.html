<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SETU Lens</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 17c3-6 6-9 9-9s6 3 9 9" />
          <circle cx="12" cy="8" r="1.6" fill="currentColor" stroke="none" />
        </svg>
      </span>
      <div>
        <h1>SETU Lens</h1>
        <p class="tag">Bridge to a calmer web</p>
      </div>
    </div>
    <button class="engine" id="engine" type="button" title="Engine status — click to re-check">
      <span class="dot" id="engine-dot"></span>
      <span id="engine-label">checking</span>
    </button>
  </header>

  <div class="scroll">
    <!-- ============ AI ACTIONS ============ -->
    <section class="block">
      <h2 class="label">Ask SETU</h2>
      <button class="hero" id="act-commander" type="button">
        <span class="hero-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="11" width="18" height="10" rx="2.5" />
            <circle cx="12" cy="5" r="2" /><path d="M12 7v4" />
            <path d="M8.5 16h.01M15.5 16h.01" />
          </svg>
        </span>
        <span class="hero-text">
          <strong>Open Commander</strong>
          <small>Say what you want to do — I'll do it on this page</small>
        </span>
        <kbd>⌥⇧C</kbd>
      </button>

      <div class="grid-3">
        <button class="tile" id="act-chunk" type="button">
          <span class="tile-glyph">1·2·3</span>
          <span>3-step path</span>
        </button>
        <button class="tile" id="act-visual" type="button">
          <span class="tile-glyph">◱</span>
          <span>Explain a chart</span>
        </button>
        <button class="tile" id="act-sanctuary" type="button">
          <span class="tile-glyph">✦</span>
          <span>To Sanctuary</span>
        </button>
      </div>
    </section>

    <!-- ============ READING TOOLS ============ -->
    <section class="block">
      <div class="label-row">
        <h2 class="label">Reading tools</h2>
        <span class="hint" id="active-count"></span>
      </div>
      <p class="note">Turn on as many as you like — they work together.</p>

      <div class="grid-2" id="tools">
        <button class="tool" data-feature="bionic" type="button" aria-pressed="false">
          <span class="tool-glyph"><b>Bi</b>onic</span>
          <span class="tool-name">Bionic Reading</span>
          <span class="tool-key">⌥B</span>
        </button>
        <button class="tool" data-feature="lineFocus" type="button" aria-pressed="false">
          <span class="tool-glyph">▤</span>
          <span class="tool-name">Line Focus</span>
          <span class="tool-key">⌥L</span>
        </button>
        <button class="tool" data-feature="highlight" type="button" aria-pressed="false">
          <span class="tool-glyph">▬</span>
          <span class="tool-name">Reading Ruler</span>
          <span class="tool-key">⌥H</span>
        </button>
        <button class="tool" data-feature="focus" type="button" aria-pressed="false">
          <span class="tool-glyph">◎</span>
          <span class="tool-name">Focus Mode</span>
          <span class="tool-key">⌥F</span>
        </button>
        <button class="tool" data-feature="tts" type="button" aria-pressed="false">
          <span class="tool-glyph">◍</span>
          <span class="tool-name">Read Aloud</span>
          <span class="tool-key">⌥T</span>
        </button>
        <button class="tool" data-feature="scroll" type="button" aria-pressed="false">
          <span class="tool-glyph">⇕</span>
          <span class="tool-name">Auto Scroll</span>
          <span class="tool-key">⌥S</span>
        </button>
        <button class="tool" data-feature="eye" type="button" aria-pressed="false">
          <span class="tool-glyph">◉</span>
          <span class="tool-name">Gaze Scroll</span>
          <span class="tool-key">⌥E</span>
        </button>
        <button class="tool" data-feature="breathe" type="button" aria-pressed="false">
          <span class="tool-glyph">◌</span>
          <span class="tool-name">Breathe Protocol</span>
          <span class="tool-key">auto</span>
        </button>
      </div>
    </section>

    <!-- ============ THEMES ============ -->
    <section class="block">
      <h2 class="label">Reading theme</h2>
      <div class="themes" id="themes" role="radiogroup" aria-label="Reading theme">
        <button data-theme="default"  role="radio" aria-checked="true"  style="--sw:#ffffff;--sf:#111" type="button"><span></span>Off</button>
        <button data-theme="sepia"    role="radio" aria-checked="false" style="--sw:#f6ecd9;--sf:#3b3226" type="button"><span></span>Sepia</button>
        <button data-theme="dark"     role="radio" aria-checked="false" style="--sw:#12151c;--sf:#dfe3ea" type="button"><span></span>Dark</button>
        <button data-theme="calm"     role="radio" aria-checked="false" style="--sw:#eef4f2;--sf:#26332f" type="button"><span></span>Calm</button>
        <button data-theme="contrast" role="radio" aria-checked="false" style="--sw:#000000;--sf:#ffe600" type="button"><span></span>AAA</button>
        <button data-theme="dyslexia" role="radio" aria-checked="false" style="--sw:#fffbf0;--sf:#2b2b2b" type="button"><span></span>Dyslexia</button>
      </div>
    </section>

    <!-- ============ TUNING ============ -->
    <details class="block details">
      <summary><h2 class="label">Fine-tuning</h2></summary>

      <label class="slider">
        <span>Bionic strength <b id="v-bionic">45%</b></span>
        <input type="range" id="s-bionic" min="25" max="70" step="5" value="45" />
      </label>

      <label class="slider">
        <span>Scroll speed <b id="v-wpm">220 wpm</b></span>
        <input type="range" id="s-wpm" min="60" max="800" step="20" value="220" />
      </label>

      <label class="slider">
        <span>Speech rate <b id="v-rate">1.0×</b></span>
        <input type="range" id="s-rate" min="5" max="25" step="1" value="10" />
      </label>

      <label class="field">
        <span>Explain in language</span>
        <input type="text" id="s-language" placeholder="English" />
      </label>

      <label class="field">
        <span>SETU engine URL</span>
        <div class="row">
          <input type="text" id="s-api" placeholder="http://localhost:3000" />
          <button class="mini" id="save-api" type="button">Save</button>
        </div>
      </label>
    </details>
  </div>

  <footer class="bottom">
    <button class="ghost" id="act-reset" type="button">Turn everything off</button>
    <button class="ghost" id="act-open-web" type="button">Open Sanctuary →</button>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>
</html>
